<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice Pit</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a0a;--panel:#1a1212;--blood:#c4262e;--green:#3fae5a;--cream:#e8dcc0;--gold:#e0a82e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--cream);font-family:'VT323','Courier New',monospace;font-size:22px;overflow:hidden;color-scheme:dark;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.ic{image-rendering:pixelated;vertical-align:middle;display:inline-block}
#ui{position:absolute;inset:0;pointer-events:none}
#wallet{position:absolute;top:calc(env(safe-area-inset-top,0px) + 4px);left:12px;display:flex;align-items:center;gap:6px;font-size:92px;line-height:1;color:var(--gold);text-shadow:4px 4px 0 #000}
#quota{position:absolute;top:calc(env(safe-area-inset-top,0px) + 92px);left:18px;font-size:46px;color:var(--blood);text-shadow:3px 3px 0 #000}
#quota.ok{color:var(--green)}
#side{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;display:flex;align-items:center;gap:6px;font-size:52px;text-shadow:3px 3px 0 #000}
#streak{position:absolute;top:calc(env(safe-area-inset-top,0px) + 76px);right:14px;font-size:38px;color:#ff8a30;text-shadow:3px 3px 0 #000,0 0 14px #ff5a20;display:none}
#pops{position:absolute;inset:0;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,0);font-size:84px;color:var(--gold);white-space:nowrap;text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 0 18px #e0a82e;animation:pop 1.3s ease-out forwards}
.pop.big{font-size:120px;color:#ff5a30;text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 0 26px #ff3010}
.pop.tot{color:var(--green);font-size:68px;text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000}
@keyframes pop{0%{transform:translate(-50%,20px) scale(.3);opacity:0}15%{transform:translate(-50%,0) scale(1.3);opacity:1}30%{transform:translate(-50%,0) scale(1)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
button{font:inherit;color:var(--cream);background:var(--blood);border:3px solid var(--cream);padding:4px 18px;cursor:pointer;pointer-events:auto}
button:hover:not(:disabled){background:var(--gold);color:#000}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
#roll{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);width:100px;height:100px;padding:0;display:grid;place-items:center}
#roll img{width:76px;height:76px;image-rendering:pixelated}
#pay{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);right:16px;width:84px;height:84px;padding:0;display:none;place-items:center;background:var(--green);color:#000}
.ov{position:absolute;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;overflow:auto;text-align:center}
.ov h1{margin:0;font-size:48px;font-weight:400;color:var(--gold)}
#death h1{color:var(--blood);font-size:64px}
#offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:780px;width:100%}
.card{border:3px solid var(--cream);background:var(--panel);padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center}
.card small{font-size:18px;opacity:.85;min-height:40px;line-height:1}
.card.sold{opacity:.3}
.chip{border:2px solid var(--gold);background:var(--panel);padding:0 8px 0 2px;cursor:pointer;font-size:20px;display:flex;align-items:center;gap:4px}
#msg{color:var(--blood);min-height:24px}
#tD,#tI,#rr{display:none}
.machine{border:4px solid var(--gold);background:linear-gradient(#3a1a1a,#1a0a0a);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;width:310px;box-shadow:0 0 0 3px #000,6px 6px 0 #000}
.reels{display:flex;gap:6px;background:#000;padding:6px;border:3px solid var(--cream)}
.reel{width:92px;height:92px;background:#2a1a1a;display:grid;place-items:center;overflow:hidden}
.machine.win{animation:win .35s steps(2) 5}
@keyframes win{50%{background:#6a5a10;border-color:#fff}}
.machine{position:relative;width:350px;padding:10px 40px 10px 10px}
.mt{color:var(--gold);font-size:28px;line-height:1}
.mh{font-size:18px;opacity:.8;line-height:1}
.lights{display:flex;gap:6px}
.lights b{width:12px;height:12px;background:#5a3a10}
.spinning .lights b{animation:bl .3s steps(2) infinite}
.spinning .lights b:nth-child(odd){animation-delay:.15s}
@keyframes bl{50%{background:#ffd040;box-shadow:0 0 8px #ffd040}}
.reel{position:relative;overflow:hidden}
.reel:nth-child(2){outline:3px solid var(--gold);outline-offset:-3px}
.reel:after{content:'';position:absolute;inset:0;background:linear-gradient(#000a,#0000 28%,#0000 72%,#000a);pointer-events:none}
.strip{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;will-change:transform}
.cell{height:92px;flex:none;display:grid;place-items:center}
.lv{position:absolute;right:12px;top:70px;width:14px;height:100px;transform-origin:50% 100%}
.lv:before{content:'';position:absolute;left:4px;top:8px;width:6px;bottom:0;background:#999}
.lv i{position:absolute;left:-3px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--blood);border:3px solid #000}
.lv.pulled{animation:lvr .7s ease-in-out}
@keyframes lvr{40%{transform:scaleY(.3)}}
.machine{display:block;position:relative;width:320px;height:380px;padding:0;border:0;background:none;box-shadow:none;margin-right:76px}
.machine>*{position:absolute}
.reels{left:16px;top:104px;width:288px;height:92px;padding:0;border:0;background:#050303;z-index:1;gap:6px}
.cab{left:0;top:0;width:320px;height:380px;z-index:2;pointer-events:none;image-rendering:pixelated}
.machine.win{animation:none}
.machine.win .cab{animation:cabw .35s steps(2) 5}
@keyframes cabw{50%{filter:brightness(1.8)}}
.mt{left:0;right:0;top:20px;text-align:center;z-index:3;font-size:30px;color:var(--gold);text-shadow:2px 2px 0 #000}
.lights{left:16px;right:16px;top:90px;justify-content:space-between;z-index:3}
.pull{left:52px;width:216px;top:246px;height:54px;z-index:3;font-size:26px}
.machine .res{left:48px;width:224px;top:308px;height:30px;overflow:hidden;z-index:3;font-size:17px;line-height:1;color:var(--cream)}
.lev{left:296px;top:196px;width:96px;height:104px;z-index:4;image-rendering:pixelated;pointer-events:none}
@media (max-width:440px){.machine{zoom:.85}}
#sInfo{color:var(--cream)}
#sInfo b{color:var(--gold);font-weight:400}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="wallet"><img class="ic" id="coinI" width="72" height="72" alt=""><b id="hW">0</b></div>
  <div id="quota"></div>
  <div id="side"><img class="ic" id="dieI" width="52" height="52" alt=""><span id="hT">0</span></div>
  <div id="streak"></div>
  <div id="pops"></div>
  <button id="roll" aria-label="Tirar dados"><img id="rollI" alt=""></button>
  <button id="pay" aria-label="Pagar la cuota"><svg viewBox="0 0 10 10" width="52" height="52"><path d="M1 5.5l3 3 5-7" fill="none" stroke="#0c0a0a" stroke-width="1.8"/></svg></button>
</div>
<div class="ov" id="shop">
  <h1>Tienda</h1>
  <div id="sInfo"></div>
  <div><button id="tD">Tienda de dados</button> <button id="tI">Tienda de objetos</button></div>
  <div id="machines"></div><div id="offers" style="display:none"></div>
  <div id="msg"></div>
  <div id="sOwned" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:780px"></div>
  <div><button id="rr">Renovar (3)</button> <button id="next">Siguiente ronda</button></div>
</div>
<div class="ov" id="death">
  <h1>Has muerto</h1>
  <div id="dMsg"></div>
  <button id="again">Volver a empezar</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const SET={sound:true,vol:.5,shake:true,fx:true,px:3,lang:'es'};
try{Object.assign(SET,JSON.parse(localStorage.getItem('dicepit_set')||'{}'))}catch(e){}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const DICE={
 basic:{n:'Dado normal',d:'Sin efecto',p:0,c:'#e8dcc0',k:'#1a1010'},
 par:{n:'Dado par',d:'Si sale par: ×2',p:8,c:'#3f7fd0',k:'#e8dcc0'},
 impar:{n:'Dado impar',d:'Si sale impar: +3',p:7,c:'#c4262e',k:'#e8dcc0'},
 pesado:{n:'Dado pesado',d:'Solo saca 4, 5 o 6',p:10,c:'#555555',k:'#e8dcc0'},
 dorado:{n:'Dado dorado',d:'Un 6 vale ×3',p:12,c:'#e0a82e',k:'#1a1010'},
 caos:{n:'Dado del caos',d:'Multiplica ×0, ×1, ×2 o ×3',p:9,c:'#8a3fc4',k:'#e8dcc0'}
};
Object.assign(DICE,{
 clon:{n:'Dado clon',d:'Copia el valor del dado de su izquierda',p:10,c:'#9fd0e0',k:'#1a1010'},
 fuego:{n:'Dado de fuego',d:'Si sale 6: +4 por cada otro dado',p:12,c:'#e8601c',k:'#ffe070'},
 suicida:{n:'Dado suicida',d:'Un 1 vale 10, pero un 6 vale 0',p:8,c:'#5a1030',k:'#f0e8d0'},
 trampa:{n:'Dado trampa',d:'Solo saca 5 o 6',p:16,c:'#2a6a3a',k:'#e8dcc0'},
 multi:{n:'Dado múltiple',d:'Vale su número × los dados en la mesa',p:13,c:'#e87cb0',k:'#1a1010'},
 siete:{n:'Dado del siete',d:'Si la suma de la tirada es múltiplo de 7: ×3',p:11,c:'#2a3a8a',k:'#ffd040'},
 creciente:{n:'Dado creciente',d:'Suma +1 por cada tirada de la ronda',p:9,c:'#7a5a2a',k:'#e8dcc0'},
 bomba:{n:'Dado bomba',d:'Con 4 o más vale ×3; con menos explota y vale 0',p:11,c:'#101010',k:'#ff7a20'},
 banquero:{n:'Dado banquero',d:'Suma el 5% de tu cartera (mínimo 1)',p:10,c:'#b8c0c8',k:'#1a1010'},
 rebote:{n:'Dado rebote',d:'Si sale par, tira otra vez y suma',p:12,c:'#40c0b0',k:'#1a1010'}
});
const ITEMS={
 trebol:{n:'Trébol',d:'+2 monedas por cada dado',p:10},
 cuernos:{n:'Diablillo',d:'Los 6 dan +6 extra',p:12},
 espejo:{n:'Espejo',d:'Con combinación: total ×2',p:14},
 saco:{n:'Saco',d:'Al pagar la cuota, +10% de interés',p:11},
 reloj:{n:'Reloj',d:'+1 tirada por ronda',p:13},
 vela:{n:'Vela',d:'+5 monedas por tirada',p:8},
 iman:{n:'Imán',d:'Los 1 dan +3 extra',p:9},
 moneda:{n:'Moneda',d:'35% de ×2 en cada tirada',p:14},
 calavera:{n:'Calavera',d:'Total ×1.5, pero 1 tirada menos',p:14},
 llave:{n:'Llave',d:'Todos pares (2+ dados): +15',p:11},
 dinamita:{n:'Dinamita',d:'La primera tirada de la ronda ×2',p:12},
 comodin:{n:'Comodín',d:'Tres dados iguales: +20',p:13},
 copa:{n:'Copa',d:'Las combinaciones valen +0.5',p:12},
 herradura:{n:'Herradura',d:'Los impares dan +1 extra',p:9},
 diente:{n:'Diente de oro',d:'Los 6 dorados valen ×6',p:13},
 ancla:{n:'Ancla',d:'Dados pesados: +4 cada uno',p:8},
 ojo:{n:'Ojo',d:'La racha sube +0.5 por nivel',p:12}
};
Object.assign(DICE,{
 fijo:{n:'Dado fijo',d:'Siempre vale 5',p:9,c:'#8a8a8a',k:'#ffffff'},
 afortunado:{n:'Dado afortunado',d:'Saca el mejor de dos tiradas',p:12,c:'#3fae5a',k:'#fff8c0'},
 maldito:{n:'Dado maldito',d:'Saca el peor de dos, pero vale ×3',p:10,c:'#2a0a3a',k:'#d070ff'},
 eco:{n:'Dado eco',d:'Suma también lo que sacó la tirada anterior',p:10,c:'#40a0e0',k:'#e8f8ff'},
 contagio:{n:'Dado contagioso',d:'Si sale 3: +2 por cada otro dado',p:9,c:'#8ac030',k:'#1a1010'},
 ruleta:{n:'Dado ruleta',d:'×0, ×1 o ×6 al azar (×6 es raro)',p:11,c:'#1f6f5a',k:'#ffd040'},
 veterano:{n:'Dado veterano',d:'Suma el número de la ronda',p:10,c:'#6a6a4a',k:'#e8dcc0'},
 hielo:{n:'Dado de hielo',d:'Si sale 1 o 2: ganas una tirada extra',p:12,c:'#b0e0ff',k:'#103050'},
 coleccionista:{n:'Dado coleccionista',d:'+3 por cada objeto en la mesa',p:11,c:'#a06a2a',k:'#ffe070'},
 gemelo:{n:'Dado gemelo',d:'Con 2 gemelos en la mesa: total ×2',p:13,c:'#e8e0f0',k:'#8a3fc4'}
});
Object.assign(ITEMS,{
 bateria:{n:'Batería',d:'El total sube +10% por cada tirada ya hecha en la ronda',p:11},
 diamante:{n:'Diamante',d:'Sin valores repetidos (2+ dados): +8 por dado',p:12},
 revolver:{n:'Revólver',d:'1 de cada 6 tiradas: ×6',p:13},
 cofre:{n:'Cofre',d:'+15 monedas al empezar cada ronda',p:10},
 escudo:{n:'Escudo',d:'Te salva una vez de no llegar a la cuota',p:15},
 cupon:{n:'Cupón',d:'Renovar la tienda es gratis',p:9},
 balanza:{n:'Balanza',d:'Vendes al precio completo',p:10},
 corona:{n:'Corona',d:'Todos los dados 4 o más (2+): total ×3',p:13},
 diana:{n:'Diana',d:'Si la suma es 10, 15 o 20: +25',p:11},
 lazo:{n:'Lazo',d:'+4 por cada dado con valor repetido',p:9}
});
const STY={
 par:{pat:'stripes',pip:'round'},impar:{pat:'check',pip:'tri'},pesado:{pat:'rivets',r:.08,sc:.95},
 dorado:{pat:'stars',pip:'star',emi:0x403000},caos:{pat:'marble',pip:'ring'},clon:{pat:'waves',r:.3},
 fuego:{pat:'flame',pip:'star',emi:0x401000},suicida:{pat:'camo',pip:'ring'},trampa:{pat:'brick',r:.05},
 multi:{pat:'circuit'},siete:{pat:'stars',pip:'star'},creciente:{pat:'brick',sc:.85},
 bomba:{pat:'rivets',pip:'ring',r:.25,emi:0x300800},banquero:{pat:'marble',pip:'round'},rebote:{pat:'waves',pip:'round',r:.35},
 fijo:{pat:'check',r:.05},afortunado:{pat:'stars',pip:'star',emi:0x204020},maldito:{pat:'flame',pip:'ring',emi:0x300030},
 eco:{pat:'waves',pip:'ring',r:.2},contagio:{pat:'camo',pip:'tri'},ruleta:{pat:'stripes',pip:'round',r:.4,sc:.95},
 veterano:{pat:'brick',pip:'star'},hielo:{pat:'marble',pip:'round',r:.2,emi:0x103050},coleccionista:{pat:'circuit',pip:'tri'},
 gemelo:{pat:'check',pip:'round',sc:1}
};
function patt(g,t){
 const p=(STY[t]||{}).pat,r=Math.random;if(!p)return;
 if(p==='stripes'){g.fillStyle='rgba(255,255,255,.14)';for(let y=1;y<31;y++)for(let x=1;x<31;x++)if((x+y)%10<3)g.fillRect(x,y,1,1)}
 if(p==='check'){g.fillStyle='rgba(0,0,0,.2)';for(let by=0;by<4;by++)for(let bx=0;bx<4;bx++)if((bx+by)%2)g.fillRect(1+bx*7.5|0,1+by*7.5|0,8,8)}
 if(p==='flame'){for(let x=1;x<31;x++){const h=4+Math.sin(x*.9)*3+r()*3;g.fillStyle='rgba(255,140,30,.6)';g.fillRect(x,31-h,1,h);g.fillStyle='rgba(255,230,90,.55)';g.fillRect(x,31-h*.5,1,h*.5)}}
 if(p==='stars'){g.fillStyle='rgba(255,255,200,.8)';for(let i=0;i<9;i++){const x=3+r()*24|0,y=3+r()*24|0;g.fillRect(x,y,1,1);g.fillRect(x-1,y,3,1);g.fillRect(x,y-1,1,3)}}
 if(p==='circuit'){g.fillStyle='rgba(60,255,120,.4)';g.fillRect(2,6,20,1);g.fillRect(21,6,1,8);g.fillRect(8,25,22,1);g.fillRect(8,16,1,10);g.fillRect(24,12,5,5);g.fillRect(3,14,3,3)}
 if(p==='marble'){for(let n=0;n<4;n++){let x=r()*32|0,y=r()*32|0;g.fillStyle=r()<.5?'rgba(255,255,255,.35)':'rgba(0,0,0,.3)';for(let s=0;s<26;s++){g.fillRect(Math.max(1,Math.min(30,x)),Math.max(1,Math.min(30,y)),1,1);x+=r()<.6?1:0;y+=r()<.5?1:-1}}}
 if(p==='rivets'){[[4,4],[26,4],[4,26],[26,26]].forEach(q=>{g.fillStyle='rgba(0,0,0,.5)';g.fillRect(q[0],q[1],3,3);g.fillStyle='rgba(255,255,255,.5)';g.fillRect(q[0],q[1],1,1)})}
 if(p==='waves'){g.fillStyle='rgba(255,255,255,.16)';for(let y=5;y<30;y+=5)for(let x=1;x<31;x++)g.fillRect(x,y+Math.sin(x*.5)*1.5|0,1,1)}
 if(p==='camo'){for(let i=0;i<10;i++){g.fillStyle=i%2?'rgba(0,0,0,.2)':'rgba(255,255,255,.1)';g.fillRect(r()*24|0,r()*26|0,6+r()*4|0,4+r()*3|0)}}
 if(p==='brick'){g.fillStyle='rgba(0,0,0,.28)';for(let y=1;y<31;y+=8){g.fillRect(1,y,30,1);for(let x=(y%16===1?8:0);x<31;x+=16)g.fillRect(x+1,y,1,8)}}
}
function pip(g,x,y,col,s){
 g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x-1,y-1,6,6);g.fillStyle=col;
 if(s==='round'){g.fillRect(x+1,y,2,4);g.fillRect(x,y+1,4,2)}
 else if(s==='star'){g.fillRect(x+1,y-1,2,6);g.fillRect(x-1,y+1,6,2)}
 else if(s==='ring'){g.fillRect(x,y,4,4);g.fillStyle='rgba(0,0,0,.65)';g.fillRect(x+1,y+1,2,2)}
 else if(s==='tri'){g.fillRect(x+1,y,2,2);g.fillRect(x,y+2,4,2)}
 else{g.fillRect(x,y,4,4);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x,y,1,1)}
}
let MAXD=6,MAXI=4;
let S;
const cnt=k=>S.items.filter(x=>x===k).length;
const quota=r=>Math.round(10*Math.pow(1.6,r-1));

/* ---------- texturas ---------- */
const TXC={},MM={};
function buildTex(kind){
 const N=32,k=document.createElement('canvas');k.width=k.height=N;const g=k.getContext('2d'),r=Math.random;
 const px=(x,y,v)=>{v=Math.max(60,Math.min(255,v|0));g.fillStyle='rgb('+v+','+v+','+v+')';g.fillRect(x,y,1,1)};
 const col=[];for(let x=0;x<N;x++)col.push(r()*26);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  let v=225+r()*30-15;
  if(kind==='felt'){v=222+r()*34-17;if(r()<.08)v-=40;if((x*3+y*5)%11===0)v+=12}
  else if(kind==='wood'){v=205+Math.sin(y*.8+Math.sin(x*.2)*2.5)*24+r()*10;if(x%16===0)v=80;if(x%16===1)v-=30}
  else if(kind==='stone'){v=190+r()*40+Math.sin(x*.7)*Math.cos(y*.6)*18;if(r()<.05)v-=60}
  else if(kind==='metal'){v=205+col[x]+((x+y)%32<4?35:0)-(y<2||y>29?40:0)}
  else if(kind==='leather'){v=218-((x*7+y*13)%5)*9+r()*10;if(y===3&&x%4<2)v=110}
  else if(kind==='wax'){v=238+Math.sin(x*.6)*10+r()*6;if(x%9===0&&y>10)v-=28}
  else if(kind==='leaf'){v=215+r()*22;if(Math.abs(x-16)<1||Math.abs(y-12-Math.abs(x-16)*.5)<1)v=140}
  else if(kind==='horn'){v=205+Math.sin(y*1.2)*32+r()*10}
  px(x,y,v);
 }
 if(kind==='stone'){for(let n=0;n<3;n++){let x=r()*N|0,y=r()*N|0;for(let s=0;s<12;s++){px(x%N,y%N,70);x+=r()<.5?1:0;y+=r()<.7?1:-1;y=(y+N)%N}}}
 const t=new THREE.CanvasTexture(k);t.magFilter=t.minFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const lm=(c,rep,kind)=>{

 if(mx>=4){cn='POKER';cm=4}else if(mx===3){cn='TRÍO';cm=2.5}else if(best>=3){cn='ESCALERA';cm=2}else if(mx===2){cn='PAREJA';cm=1.5}
 if(cn){cm+=.5*cnt('copa');tot*=cm;push(cn+' ×'+cm,0xffd040,{mult:cm>=2?1:0,big:cm>=2.5,item:cnt('copa')?'copa':null})}
